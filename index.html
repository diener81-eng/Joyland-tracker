<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyland Tracker</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      text-align: center;
      padding: 1rem;
    }

    h2 { margin-bottom: .35rem; }

    .desc {
      font-size: 0.95rem;
      color: #ccc;
      margin-bottom: 0.9rem;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.4;
    }

    button {
      font-size: 1.02rem;
      padding: 1rem;
      margin: .35rem;
      width: 90%;
      max-width: 440px;
      border-radius: 12px;
      border: none;
    }

    .btnSub {
      display:block;
      font-size: 0.82rem;
      opacity: 0.82;
      margin-top: 2px;
      font-style: italic;
    }

    .startEvent { background:#2ecc71; color:#000; font-weight:700; }
    .startSeq { background:#27ae60; color:#000; font-weight:700; }

    .tiny { background:#444; color:#fff; }
    .crossroads { background:#16a085; color:#000; }

    /* Special buttons */
    .cubeBtn { background:#c0392b; color:#fff; }       /* Cube Battle (old Axe Ricochet) */
    .treasureBtn { background:#2980b9; color:#fff; }   /* Treasure Hunt (old Card Realm) */

    /* Non-special */
    .axeRicoBtn { background:#27ae60; color:#000; }    /* Axe Ricocheting (old Blocks Duel) */
    .frenzyBtn { background:#f1c40f; color:#000; }     /* Frenzy Wheel (old Jackpot) */

    .undo { background:#8e44ad; color:#fff; }
    .reset { background:#555; color:#fff; }

    .divider {
      margin: 1rem auto;
      width: 90%;
      max-width: 440px;
      border-top: 1px solid #333;
    }

    pre {
      white-space: pre-line;
      text-align: left;
      margin: .8rem auto 0 auto;
      width: 90%;
      max-width: 440px;
      background: #141414;
      border-radius: 10px;
      padding: .7rem .8rem;
      color: #ddd;
      font-size: .92rem;
    }

    .alert {
      margin: .6rem auto 0 auto;
      width: 90%;
      max-width: 440px;
      font-weight: 700;
      color: #ff9f43;
    }

    .history {
      max-height: 120px;
      overflow-y: auto;
      background: #181818;
      border-radius: 10px;
      padding: .5rem;
      font-size: .9rem;
      color: #ccc;
      margin: .75rem auto;
      width: 90%;
      max-width: 440px;
      text-align: left;
    }

    .timeline {
      display: flex;
      justify-content: center;
      margin-top: .6rem;
    }
    #timelineBottom { margin-top: 10px; }

    .cell {
      width: 28px;
      height: 28px;
      margin: 4px;
      border-radius: 6px;
      font-size: .8rem;
      line-height: 28px;
      background: #333;
      color: #fff;
      text-align: center;
    }
    .done { filter: brightness(0.6); }
    .current { outline: 3px solid #fff; }
    .nextSpecial { outline: 3px solid #e67e22; }

    /* Only these two get color (specials) */
    .cubeCell { background: #c0392b; border: 2px solid #fff; }      /* Cube Battle */
    .treasureCell { background: #2980b9; border: 2px solid #fff; }  /* Treasure Hunt */

    small { display:block; opacity:.7; line-height: 1; margin-top: 2px; }

    /* Cycle badges */
    #cycleStatus {
      margin: 8px auto 0 auto;
      width: 90%;
      max-width: 440px;
      text-align: left;
      font-size: 13px;
      color: #aaa;
      line-height: 1.35;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      margin: 2px 6px 2px 0;
      border-radius: 999px;
      border: 1px solid #444;
      font-size: 12px;
      color: #ddd;
    }
    .badge.done { border-color: #2ecc71; color: #2ecc71; }
    .badge.rem { border-color: #666; color: #bbb; }
    .badge.unk { border-color: #888; color: #bbb; }
    .badgeRow { margin-top: 4px; }
  </style>
</head>

<body>
  <h2>Joyland Tracker</h2>

  <div class="desc">
    Tap each event as it appears in Joyland.<br>
    You will be warned when to use <b>50× compass</b>.<br>
    Cube Battle → always 50× <span style="opacity:.8;font-style:italic;">(old Axe Ricochet*w)</span><br>
    Treasure Hunt → 50× only if you need gold <span style="opacity:.8;font-style:italic;">(old Card Realm*w)</span>
  </div>

  <button class="startEvent" onclick="startEventReset()">Start Event (cycle reset)</button>
  <button class="startSeq" onclick="startNewSequenceKnown()">Start New Sequence (I am on move 1)</button>

  <button class="tiny" onclick="tap('Tiny Adventures')">T · Tiny Adventures</button>
  <button class="crossroads" onclick="tap('Crossroads of Fate')">F · Crossroads of Fate</button>

  <button class="cubeBtn" onclick="tap('Cube Battle')">
    A · Cube Battle
    <span class="btnSub">(old Axe Ricochet*w)</span>
  </button>

  <button class="treasureBtn" onclick="tap('Treasure Hunt')">
    C · Treasure Hunt
    <span class="btnSub">(old Card Realm*w)</span>
  </button>

  <button class="axeRicoBtn" onclick="tap('Axe Ricocheting')">
    B · Axe Ricocheting
    <span class="btnSub">(old Blocks Duel*w)</span>
  </button>

  <button class="frenzyBtn" onclick="tap('Frenzy Wheel')">
    J · Frenzy Wheel
    <span class="btnSub">(old Jackpot*w)</span>
  </button>

  <div class="alert" id="alert"></div>
  <div class="alert" id="banner"></div>

  <pre id="status">Waiting for input…</pre>
  <div id="cycleStatus"></div>

  <div class="history" id="history"></div>

  <div class="timeline" id="timelineTop"></div>
  <div class="timeline" id="timelineBottom"></div>

  <div class="divider"></div>
  <button class="undo" onclick="undo()">Undo Last Tap</button>
  <button class="reset" onclick="hardReset()">Reset All</button>

  <div style="margin-top:14px;font-size:12px;color:#777;">
    Joyland Tracker v<span id="verNum"></span>
  </div>

<script>
/* ------------------ Data ------------------ */
const sequences = {
  1:["Tiny Adventures","Crossroads of Fate","Tiny Adventures","Axe Ricocheting","Tiny Adventures","Tiny Adventures","Crossroads of Fate","Treasure Hunt","Tiny Adventures","Crossroads of Fate","Tiny Adventures","Axe Ricocheting","Frenzy Wheel"],
  2:["Tiny Adventures","Tiny Adventures","Cube Battle","Tiny Adventures","Crossroads of Fate","Treasure Hunt","Tiny Adventures","Tiny Adventures","Crossroads of Fate","Frenzy Wheel","Crossroads of Fate","Tiny Adventures","Axe Ricocheting"],
  3:["Tiny Adventures","Tiny Adventures","Crossroads of Fate","Treasure Hunt","Tiny Adventures","Tiny Adventures","Cube Battle","Tiny Adventures","Crossroads of Fate","Frenzy Wheel","Tiny Adventures","Axe Ricocheting","Crossroads of Fate"],
  4:["Tiny Adventures","Tiny Adventures","Treasure Hunt","Tiny Adventures","Crossroads of Fate","Tiny Adventures","Cube Battle","Tiny Adventures","Crossroads of Fate","Tiny Adventures","Crossroads of Fate","Cube Battle","Frenzy Wheel"]
};

const VERSION = "1.11.1";

const abbrev = {
  "Tiny Adventures":"T",
  "Crossroads of Fate":"F",
  "Cube Battle":"A",
  "Treasure Hunt":"C",
  "Axe Ricocheting":"B",
  "Frenzy Wheel":"J"
};

const ALL_MASK = 0b1111;
const bit = (seq) => (1 << (seq-1));

let states = [];
let inputHistory = [];
let cycleLocked = false;
let statesStack = [];
let cycleLockedStack = [];

/* ------------------ Persistence ------------------ */
function saveState(){
  localStorage.setItem(
    "joyland_cycle_tracker",
    JSON.stringify({ states, inputHistory, cycleLocked, statesStack, cycleLockedStack })
  );
}

function loadState(){
  const s = localStorage.getItem("joyland_cycle_tracker");
  if(!s) return false;
  try{
    const d = JSON.parse(s);
    states = d.states || [];
    inputHistory = d.inputHistory || [];
    cycleLocked = d.cycleLocked || false;
    statesStack = d.statesStack || [];
    cycleLockedStack = d.cycleLockedStack || [];
    return true;
  }catch(e){ return false; }
}

/* ------------------ Init helpers ------------------ */
function startEventReset(){
  inputHistory = [];
  states = makeStartStates(true, true);
  cycleLocked = false;

  statesStack = [];
  cycleLockedStack = [];

  render();
  saveState();
}

function startNewSequenceKnown(){
  inputHistory = [];
  states = makeStartStates(false, true);

  statesStack = [];
  cycleLockedStack = [];

  render();
  saveState();
}

function hardReset(){
  inputHistory = [];
  states = [];
  cycleLocked = false;

  statesStack = [];
  cycleLockedStack = [];

  localStorage.removeItem("joyland_cycle_tracker");
  render();
}

function makeStartStates(cycleReset, knownStart){
  const out = [];
  for(let seq=1; seq<=4; seq++){
    for(let doneMask=0; doneMask<=ALL_MASK; doneMask++){
      if(cycleReset && doneMask !== 0) continue;
      if(doneMask & bit(seq)) continue;
      out.push({ seq, move: 1, doneMask, modeStart: knownStart });
    }
  }
  return out;
}

/* ------------------ Update logic ------------------ */
function tap(event){
  if(states.length === 0){
    states = seedUnknownStates(event);
  } else {
    states = advanceStatesWithEvent(states, event);
  }

  inputHistory.push(event);
  states = dedupeStates(states);

  if (cycleLocked) {
    const counts = new Map();
    for (const s of states) counts.set(s.doneMask, (counts.get(s.doneMask) || 0) + 1);
    let bestMask = null, bestCount = -1;
    for (const [m,c] of counts.entries()) {
      if (c > bestCount) { bestCount = c; bestMask = m; }
    }
    states = states.filter(s => s.doneMask === bestMask);
  }

  statesStack.push(JSON.parse(JSON.stringify(states)));
  cycleLockedStack.push(cycleLocked);

  render();
  saveState();
}

function undo(){
  if(inputHistory.length === 0) return;

  inputHistory.pop();

  if (statesStack.length > 0) statesStack.pop();
  if (cycleLockedStack.length > 0) cycleLockedStack.pop();

  if (statesStack.length > 0) {
    states = JSON.parse(JSON.stringify(statesStack[statesStack.length - 1]));
    cycleLocked = cycleLockedStack[cycleLockedStack.length - 1] || false;
  } else {
    states = [];
    cycleLocked = false;
  }

  render();
  saveState();
}

function seedUnknownStates(firstEvent){
  const out = [];
  for(let seq=1; seq<=4; seq++){
    const moves = sequences[seq];
    for(let pos=1; pos<=13; pos++){
      if(moves[pos-1] !== firstEvent) continue;
      for(let doneMask=0; doneMask<=ALL_MASK; doneMask++){
        if(doneMask & bit(seq)) continue;
        out.push({ seq, move: pos, doneMask, modeStart: false });
      }
    }
  }
  return out;
}

function advanceStatesWithEvent(curStates, event){
  const next = [];
  for(const s of curStates){
    if(s.seq === null || s.move === 0){
      const doneMaskNorm = (s.doneMask === ALL_MASK) ? 0 : s.doneMask;
      for(let seq=1; seq<=4; seq++){
        if(doneMaskNorm & bit(seq)) continue;
        if(sequences[seq][0] !== event) continue;
        next.push({ seq, move: 2, doneMask: doneMaskNorm, modeStart: true });
      }
      continue;
    }

    const expected = sequences[s.seq][s.move - 1];
    if(expected !== event) continue;

    const newMove = s.move + 1;

    if(newMove === 14){
      let newDone = s.doneMask | bit(s.seq);
      next.push({ seq: null, move: 0, doneMask: newDone, modeStart: true });
    } else {
      next.push({ seq: s.seq, move: newMove, doneMask: s.doneMask, modeStart: s.modeStart });
    }
  }
  return next;
}

function dedupeStates(list){
  const seen = new Set();
  const out = [];
  for(const s of list){
    const k = `${s.seq ?? "X"}|${s.move}|${s.doneMask}|${s.modeStart?1:0}`;
    if(seen.has(k)) continue;
    seen.add(k);
    out.push(s);
  }
  return out;
}

/* ------------------ Rendering ------------------ */
function badgeList(nums, cls){
  if (!nums.length) return `<span class="badge ${cls}">none</span>`;
  return nums.map(n => `<span class="badge ${cls}">${n}</span>`).join("");
}

function render(){
  const status = document.getElementById("status");
  const cycleStatus = document.getElementById("cycleStatus");
  const alert = document.getElementById("alert");
  const banner = document.getElementById("banner");
  const historyBox = document.getElementById("history");
  const top = document.getElementById("timelineTop");
  const bottom = document.getElementById("timelineBottom");

  alert.textContent = "";
  banner.textContent = "";
  top.innerHTML = "";
  bottom.innerHTML = "";

  historyBox.innerHTML = inputHistory.map((e,i)=>`${i+1}. ${e}`).join("<br>");

  if(states.length === 0){
    status.textContent = inputHistory.length
      ? "No match. Use Reset All or Start New Sequence / Start Event."
      : "Waiting for input…";
    cycleStatus.innerHTML = `Cycle status: <b>${cycleLocked ? "LOCKED" : "UNKNOWN"}</b>`;
    return;
  }

  const inSeqStates = states.filter(s => s.seq !== null && s.move !== 0);
  const betweenStates = states.filter(s => s.seq === null || s.move === 0);

  const seqSet = new Set(inSeqStates.map(s => s.seq));
  if (seqSet.size === 0 && betweenStates.length > 0) {
    const possibleNext = new Set();
    for (const st of betweenStates) {
      const dmNorm = (st.doneMask === ALL_MASK) ? 0 : st.doneMask;
      for (let seq=1; seq<=4; seq++) {
        if (dmNorm & bit(seq)) continue;
        possibleNext.add(seq);
      }
    }
    possibleNext.forEach(x => seqSet.add(x));
  }

  const moveSet = new Set(inSeqStates.map(s => s.move));
  const doneMasks = new Set(states.map(s => s.doneMask));
  const locked = (seqSet.size === 1 && moveSet.size === 1 && betweenStates.length === 0);

  let completedNums = [];
  let remainingNums = [];
  let cycleKnown = (doneMasks.size === 1);

  if (cycleKnown) {
    const dm = [...doneMasks][0];
    const dmNorm = (dm === ALL_MASK) ? 0 : dm;
    completedNums = [1,2,3,4].filter(x => dmNorm & bit(x));
    remainingNums = [1,2,3,4].filter(x => !(dmNorm & bit(x)));
  }

  cycleStatus.innerHTML =
    `Cycle status: <b>${cycleLocked ? "LOCKED" : "UNKNOWN"}</b><br>` +
    (cycleKnown
      ? `<div class="badgeRow">Sequences Completed this cycle: ${badgeList(completedNums, "done")}</div>` +
        `<div class="badgeRow">Remaining: ${badgeList(remainingNums, "rem")}</div>`
      : `<div class="badgeRow"><span class="badge unk">Sequences Completed/Remaining: unknown</span></div>`
    );

  let remainingHint = "";
  if(cycleKnown){
    remainingHint =
      `Cycle done: ${completedNums.length ? completedNums.join(", ") : "(none)"}\n` +
      `Remaining this cycle: ${remainingNums.join(", ")}`;
  } else {
    remainingHint = "Cycle done/remaining: unknown (tracking multiple possibilities)";
  }

  // Start-of-sequence banner after T,T (only if Crossroads is impossible)
  let earlyHint = "";
  if (
  last2.length === 2 &&
  last2[0] === "Tiny Adventures" &&
  last2[1] === "Tiny Adventures"
) {
    const candidates = inSeqStates.filter(s =>
      sequences[s.seq][0] === "Tiny Adventures" &&
      sequences[s.seq][1] === "Tiny Adventures" &&
      s.move === 3
    );

    if (candidates.length) {
      const possibleThirdMoves = new Set(candidates.map(s => sequences[s.seq][2]));
      const hasCrossroads = possibleThirdMoves.has("Crossroads of Fate");
      const hasCube = possibleThirdMoves.has("Cube Battle");
      const hasTreasure = possibleThirdMoves.has("Treasure Hunt");

      // Specifically: known cycle + completed {1,3} => remaining {2,4}
      let onlyTwoOrFourRemain = false;
      if (cycleKnown) {
        const remSet = new Set(remainingNums);
        const doneSet = new Set(completedNums);
        onlyTwoOrFourRemain =
          remSet.size === 2 &&
          remSet.has(2) &&
          remSet.has(4) &&
          doneSet.has(1) &&
          doneSet.has(3);
      }

      if (!hasCrossroads && (hasCube || hasTreasure)) {
        if (onlyTwoOrFourRemain) {
          banner.textContent =
            "Start-of-sequence: next is either Cube Battle (use 50×) or Treasure Hunt (50× if you need gold or want to gamble for Joycoin).";
        } else {
          if (hasCube && hasTreasure) {
            banner.textContent =
              "Start-of-sequence: next is either Cube Battle (use 50×) or Treasure Hunt (50× if you need gold).";
          } else if (hasCube) {
            banner.textContent =
              "Start-of-sequence: next will be Cube Battle — use 50×.";
          } else if (hasTreasure) {
            banner.textContent =
              "Start-of-sequence: next will be Treasure Hunt — 50× only if you need gold.";
          }
        }
      }

      const byThird = {};
      for (const s of candidates) {
        const third = sequences[s.seq][2];
        byThird[third] = (byThird[third] || new Set());
        byThird[third].add(s.seq);
      }
      const lines = Object.entries(byThird).map(([ev, set]) => {
        const seqs = [...set].sort((a,b)=>a-b).join(", ");
        return `If next is ${ev}: sequence ${seqs}`;
      });
      earlyHint = "\nStart-of-sequence hint (after T,T):\n" + lines.join("\n");
    }
  }

  if(!locked){
    status.textContent =
      `Moves logged: ${inputHistory.length}\n` +
      `Possible states: ${states.length}\n` +
      `Possible sequences: ${[...seqSet].sort((a,b)=>a-b).join(", ") || "(between sequences)"}\n` +
      `Possible moves: ${[...moveSet].sort((a,b)=>a-b).join(", ") || "(between sequences)"}\n\n` +
      remainingHint +
      earlyHint;
    return;
  }

  const s = inSeqStates[0];
  const seq = s.seq;
  const nextExpected = s.move;
  const currentMove = s.move - 1;
  const moves = sequences[seq];

  const upcoming = moves.slice(Math.max(0, nextExpected - 1));
  let nextSpecialIndex = -1;
  for(let i=0;i<upcoming.length;i++){
    if(upcoming[i] === "Cube Battle" || upcoming[i] === "Treasure Hunt"){
      nextSpecialIndex = i;
      break;
    }
  }

  status.textContent =
    `Sequence ${seq}\n` +
    `Move ${currentMove} / 13\n\n` +
    remainingHint;

  const nextEvent = moves[nextExpected - 1];
  if (nextEvent === "Cube Battle") {
    alert.textContent = "🚨 ENABLE 50× NOW (Cube Battle is next)";
  } else if (nextEvent === "Treasure Hunt") {
    alert.textContent = "💰 Treasure Hunt is next — invest 50× if you need gold";
  } else if (nextSpecialIndex >= 0) {
    const nextEv = upcoming[nextSpecialIndex];
    const atMove = nextExpected + nextSpecialIndex;
    if (nextEv === "Cube Battle") {
      status.textContent += `\n\nNext Cube Battle at move ${atMove}`;
    } else {
      status.textContent += `\n\nNext Treasure Hunt at move ${atMove} (invest 50× if you need gold)`;
    }
  }

  for(let i=1;i<=13;i++){
    const ev = moves[i-1];
    const cell = document.createElement("div");
    cell.className = "cell";

    if(ev === "Cube Battle") cell.classList.add("cubeCell");
    if(ev === "Treasure Hunt") cell.classList.add("treasureCell");

    if(i < currentMove) cell.classList.add("done");
    if(i === currentMove) cell.classList.add("current");

    if (nextSpecialIndex >= 0 && i === (nextExpected + nextSpecialIndex)) {
      cell.classList.add("nextSpecial");
    }

    let l = abbrev[ev];
    if(l === "A" || l === "C") l = `<b>${l}</b>`;
    cell.innerHTML = `<small>${i}</small>${l}`;

    (i <= 6 ? top : bottom).appendChild(cell);
  }
}

/* Load saved state on startup */
if(!loadState()){
  states = [];
  inputHistory = [];
}
render();

// version text AFTER DOM exists
document.getElementById("verNum").textContent = VERSION;
</script>

</body>
</html>
