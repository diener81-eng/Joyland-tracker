<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyland Tracker</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      text-align: center;
      padding: 1rem;
    }

    h2 { margin-bottom: .35rem; }

    .desc {
      font-size: 0.95rem;
      color: #ccc;
      margin-bottom: 0.9rem;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.4;
    }

    /* Square button grid */
    .btnGrid{
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      aspect-ratio: 1 / 1;
      padding: 10px;
      width: 100%;
      transition: opacity .15s ease, transform .08s ease, filter .15s ease;
    }

    button:active { transform: scale(0.99); }

    /* Disabled = faded + not clickable */
    button:disabled{
      opacity: .28;
      filter: grayscale(.2);
      cursor: not-allowed;
      transform: none;
    }

    .tile {
      height: 100%;
      display:flex;
      flex-direction: column;
      align-items:center;
      justify-content:center;
      gap: 6px;
    }

    .tileTop{
      display:flex;
      flex-direction: column;
      align-items:center;
      justify-content:center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .tileLetter{
      font-weight: 950;
      font-size: 22px;
      line-height: 1;
      letter-spacing: .5px;
    }
    .tileIcon{
      font-size: 20px;
      line-height: 1;
      opacity: .95;
    }

    .tileText{
      font-weight: 900;
      font-size: 14px;
      line-height: 1.05;
      text-align: center;
    }
    .tileText .line2{
      display:block;
      font-weight: 800;
      opacity: .95;
      margin-top: 2px;
    }

    .btnSub {
      display:block;
      font-size: 11px;
      opacity: 0.8;
      margin-top: 6px;
      font-style: italic;
      font-weight: 600;
      line-height: 1.1;
    }

    /* Colors */
    .startEvent { background:#2ecc71; color:#000; }
    .startSeq   { background:#27ae60; color:#000; }

    .tiny       { background:#444; color:#fff; }
    .crossroads { background:#16a085; color:#000; }

    .cubeBtn    { background:#c0392b; color:#fff; }
    .treasureBtn{ background:#2980b9; color:#fff; }

    .axeRicoBtn { background:#27ae60; color:#000; }
    .frenzyBtn  { background:#f1c40f; color:#000; }

    .undo       { background:#8e44ad; color:#fff; }
    .reset      { background:#555; color:#fff; }

    /* Save/Load */
    .saveBtn    { background:#2d3436; color:#fff; }
    .loadBtn    { background:#3d3d3d; color:#fff; }

    .sep{
      grid-column: 1 / -1;
      height: 1px;
      background: #2a2a2a;
      border-radius: 999px;
      margin: 4px 0;
    }

    pre {
      white-space: pre-line;
      text-align: left;
      margin: .9rem auto 0 auto;
      width: 100%;
      max-width: 560px;
      background: #141414;
      border-radius: 12px;
      padding: .75rem .85rem;
      color: #ddd;
      font-size: .92rem;
    }

    .alert {
      margin: .7rem auto 0 auto;
      width: 100%;
      max-width: 560px;
      font-weight: 900;
      color: #ff9f43;
    }

    /* Pulsing 50x warning */
    .pulse50 {
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 159, 67, 0.85);
      animation: pulse50 1.05s ease-in-out infinite;
    }
    @keyframes pulse50 {
      0%   { transform: scale(1);    opacity: 0.85; }
      50%  { transform: scale(1.06); opacity: 1;    }
      100% { transform: scale(1);    opacity: 0.85; }
    }

    .history {
      max-height: 120px;
      overflow-y: auto;
      background: #181818;
      border-radius: 12px;
      padding: .6rem .7rem;
      font-size: .9rem;
      color: #ccc;
      margin: .75rem auto;
      width: 100%;
      max-width: 560px;
      text-align: left;
    }

    /* Flow squares */
    .timelineWrap{
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }
    .timeline {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      justify-items: center;
      margin-top: .75rem;
    }
    #timelineBottom { margin-top: 12px; }

    .cell {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #333;
      color: #fff;
      display:flex;
      flex-direction: column;
      align-items:center;
      justify-content:center;
      line-height: 1;
      font-weight: 900;
      position: relative;
    }
    .cell .step{
      position:absolute;
      top: 5px;
      left: 8px;
      font-size: 11px;
      opacity: .75;
      font-weight: 700;
    }
    .cell .letter{
      font-size: 18px;
      margin-top: 6px;
    }
    .done { filter: brightness(0.6); }
    .current { outline: 3px solid #fff; }
    .nextSpecial { outline: 3px solid #e67e22; }

    .cubeCell { background: #c0392b; border: 2px solid #fff; }
    .treasureCell { background: #2980b9; border: 2px solid #fff; }

    /* Cycle badges */
    #cycleStatus {
      margin: 10px auto 0 auto;
      width: 100%;
      max-width: 560px;
      text-align: left;
      font-size: 13px;
      color: #aaa;
      line-height: 1.35;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      margin: 2px 6px 2px 0;
      border-radius: 999px;
      border: 1px solid #444;
      font-size: 12px;
      color: #ddd;
    }
    .badge.done { border-color: #2ecc71; color: #2ecc71; }
    .badge.rem { border-color: #666; color: #bbb; }
    .badge.unk { border-color: #888; color: #bbb; }
    .badgeRow { margin-top: 4px; }
  </style>
</head>

<body>
  <h2>Joyland Tracker</h2>

  <div class="desc">
    Tap each event as it appears in Joyland.<br>
    You will be warned when to use <b>50× compass</b>.<br>
    Cube Battle → always 50× <span style="opacity:.8;font-style:italic;">(wiki: Axe Ricochet)</span><br>
    Treasure Hunt → 50× only if you need gold <span style="opacity:.8;font-style:italic;">(wiki: Card Realm)</span>
  </div>

  <div class="btnGrid">
    <button class="startEvent" onclick="startEventReset()">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">🟢</div><div class="tileIcon">♻️</div></div>
        <div class="tileText">Start Event<span class="line2">(cycle reset)</span></div>
      </div>
    </button>

    <button class="startSeq" onclick="startNewSequenceKnown()">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">🟩</div><div class="tileIcon">🎬</div></div>
        <div class="tileText">New Sequence<span class="line2">(move 1)</span></div>
      </div>
    </button>

    <div class="sep"></div>

    <!-- Event buttons: data-event used to enable/disable automatically -->
    <button class="tiny" data-event="Tiny Adventures" onclick="tap('Tiny Adventures')">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">T</div><div class="tileIcon">🧩</div></div>
        <div class="tileText">Tiny<span class="line2">Adventures</span></div>
      </div>
    </button>

    <button class="crossroads" data-event="Crossroads of Fate" onclick="tap('Crossroads of Fate')">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">F</div><div class="tileIcon">🧭</div></div>
        <div class="tileText">Crossroads<span class="line2">of Fate</span></div>
      </div>
    </button>

    <button class="cubeBtn" data-event="Cube Battle" onclick="tap('Cube Battle')">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">A</div><div class="tileIcon">🎲</div></div>
        <div class="tileText">Cube<span class="line2">Battle</span></div>
        <span class="btnSub">(wiki: Axe Ricochet)</span>
      </div>
    </button>

    <button class="treasureBtn" data-event="Treasure Hunt" onclick="tap('Treasure Hunt')">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">C</div><div class="tileIcon">🪙</div></div>
        <div class="tileText">Treasure<span class="line2">Hunt</span></div>
        <span class="btnSub">(wiki: Card Realm)</span>
      </div>
    </button>

    <button class="axeRicoBtn" data-event="Axe Ricocheting" onclick="tap('Axe Ricocheting')">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">B</div><div class="tileIcon">🪓</div></div>
        <div class="tileText">Axe<span class="line2">Ricocheting</span></div>
        <span class="btnSub">(wiki: Blocks Duel)</span>
      </div>
    </button>

    <button class="frenzyBtn" data-event="Frenzy Wheel" onclick="tap('Frenzy Wheel')">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">J</div><div class="tileIcon">🎡</div></div>
        <div class="tileText">Frenzy<span class="line2">Wheel</span></div>
        <span class="btnSub">(wiki: Jackpot)</span>
      </div>
    </button>

    <div class="sep"></div>

    <!-- Manual Save/Load -->
    <button class="saveBtn" onclick="copySaveCode()">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">💾</div><div class="tileIcon">📋</div></div>
        <div class="tileText">Copy<span class="line2">Save Code</span></div>
      </div>
    </button>

    <button class="loadBtn" onclick="loadSaveCodePrompt()">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">📥</div><div class="tileIcon">🧾</div></div>
        <div class="tileText">Load<span class="line2">Save Code</span></div>
      </div>
    </button>

    <div class="sep"></div>

    <button class="undo" onclick="undo()">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">↩️</div><div class="tileIcon">🕘</div></div>
        <div class="tileText">Undo<span class="line2">Last Tap</span></div>
      </div>
    </button>

    <button class="reset" onclick="hardReset()">
      <div class="tile">
        <div class="tileTop"><div class="tileLetter">🧼</div><div class="tileIcon">🗑️</div></div>
        <div class="tileText">Reset<span class="line2">All</span></div>
      </div>
    </button>
  </div>

  <div class="alert" id="alert"></div>
  <div class="alert" id="banner"></div>

  <pre id="status">Waiting for input…</pre>
  <div id="cycleStatus"></div>

  <div class="history" id="history"></div>

  <div class="timelineWrap">
    <div class="timeline" id="timelineTop"></div>
    <div class="timeline" id="timelineBottom"></div>
  </div>

  <div style="margin-top:14px;font-size:12px;color:#777;">
    Joyland Tracker v<span id="verNum"></span>
  </div>

<script>
/* ------------------ Data ------------------ */
const sequences = {
  1:["Tiny Adventures","Crossroads of Fate","Tiny Adventures","Axe Ricocheting","Tiny Adventures","Tiny Adventures","Crossroads of Fate","Treasure Hunt","Tiny Adventures","Crossroads of Fate","Tiny Adventures","Axe Ricocheting","Frenzy Wheel"],
  2:["Tiny Adventures","Tiny Adventures","Cube Battle","Tiny Adventures","Crossroads of Fate","Treasure Hunt","Tiny Adventures","Tiny Adventures","Crossroads of Fate","Frenzy Wheel","Crossroads of Fate","Tiny Adventures","Axe Ricocheting"],
  3:["Tiny Adventures","Tiny Adventures","Crossroads of Fate","Treasure Hunt","Tiny Adventures","Tiny Adventures","Cube Battle","Tiny Adventures","Crossroads of Fate","Frenzy Wheel","Tiny Adventures","Axe Ricocheting","Crossroads of Fate"],
  4:["Tiny Adventures","Tiny Adventures","Treasure Hunt","Tiny Adventures","Crossroads of Fate","Tiny Adventures","Cube Battle","Tiny Adventures","Crossroads of Fate","Tiny Adventures","Crossroads of Fate","Cube Battle","Frenzy Wheel"]
};

const VERSION = "1.13.1-lockbuttons";

const abbrev = {
  "Tiny Adventures":"T",
  "Crossroads of Fate":"F",
  "Cube Battle":"A",
  "Treasure Hunt":"C",
  "Axe Ricocheting":"B",
  "Frenzy Wheel":"J"
};

const ALL_MASK = 0b1111;
const bit = (seq) => (1 << (seq-1));

let states = [];
let inputHistory = [];
let cycleLocked = false;
let statesStack = [];
let cycleLockedStack = [];

/* ------------------ Persistence (auto) ------------------ */
function saveState(){
  localStorage.setItem(
    "joyland_cycle_tracker",
    JSON.stringify({ states, inputHistory, cycleLocked, statesStack, cycleLockedStack })
  );
}

function loadState(){
  const s = localStorage.getItem("joyland_cycle_tracker");
  if(!s) return false;
  try{
    const d = JSON.parse(s);
    states = d.states || [];
    inputHistory = d.inputHistory || [];
    cycleLocked = d.cycleLocked || false;
    statesStack = d.statesStack || [];
    cycleLockedStack = d.cycleLockedStack || [];
    return true;
  }catch(e){ return false; }
}

/* ------------------ Manual Save/Load Code ------------------ */
function buildSavePayload(){
  return { v: VERSION, t: Date.now(), states, inputHistory, cycleLocked, statesStack, cycleLockedStack };
}

function encodeSavePayload(payload){
  const json = JSON.stringify(payload);
  return btoa(unescape(encodeURIComponent(json)));
}

function decodeSavePayload(code){
  const json = decodeURIComponent(escape(atob(code.trim())));
  return JSON.parse(json);
}

async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    return false;
  }
}

async function copySaveCode(){
  try{
    const code = encodeSavePayload(buildSavePayload());
    const ok = await copyToClipboard(code);
    if(ok){
      alertBanner("✅ Save code copied to clipboard.");
    } else {
      window.prompt("Copy your Save Code:", code);
    }
  }catch(e){
    window.alert("Could not create save code. Try again.");
  }
}

function loadSaveCodePrompt(){
  const code = window.prompt("Paste Save Code here:");
  if(!code) return;
  try{
    const payload = decodeSavePayload(code);

    states = payload.states || [];
    inputHistory = payload.inputHistory || [];
    cycleLocked = payload.cycleLocked || false;
    statesStack = payload.statesStack || [];
    cycleLockedStack = payload.cycleLockedStack || [];

    saveState();
    render();
    alertBanner("✅ Save code loaded.");
  }catch(e){
    window.alert("Invalid Save Code (or truncated).");
  }
}

function alertBanner(msg){
  const banner = document.getElementById("banner");
  banner.textContent = msg;
}

/* ------------------ Init helpers ------------------ */
function startEventReset(){
  inputHistory = [];
  states = makeStartStates(true, true);
  cycleLocked = false;
  statesStack = [];
  cycleLockedStack = [];
  render();
  saveState();
}

function startNewSequenceKnown(){
  inputHistory = [];
  states = makeStartStates(false, true);
  statesStack = [];
  cycleLockedStack = [];
  render();
  saveState();
}

function hardReset(){
  inputHistory = [];
  states = [];
  cycleLocked = false;
  statesStack = [];
  cycleLockedStack = [];
  localStorage.removeItem("joyland_cycle_tracker");
  render();
}

function makeStartStates(cycleReset, knownStart){
  const out = [];
  for(let seq=1; seq<=4; seq++){
    for(let doneMask=0; doneMask<=ALL_MASK; doneMask++){
      if(cycleReset && doneMask !== 0) continue;
      if(doneMask & bit(seq)) continue;
      out.push({ seq, move: 1, doneMask, modeStart: knownStart });
    }
  }
  return out;
}

/* ------------------ Update logic ------------------ */
function tap(event){
  if(states.length === 0){
    states = seedUnknownStates(event);
  } else {
    states = advanceStatesWithEvent(states, event);
  }

  inputHistory.push(event);
  states = dedupeStates(states);

  if (cycleLocked) {
    const counts = new Map();
    for (const s of states) counts.set(s.doneMask, (counts.get(s.doneMask) || 0) + 1);
    let bestMask = null, bestCount = -1;
    for (const [m,c] of counts.entries()) {
      if (c > bestCount) { bestCount = c; bestMask = m; }
    }
    states = states.filter(s => s.doneMask === bestMask);
  }

  statesStack.push(JSON.parse(JSON.stringify(states)));
  cycleLockedStack.push(cycleLocked);

  render();
  saveState();
}

function undo(){
  if(inputHistory.length === 0) return;

  inputHistory.pop();

  if (statesStack.length > 0) statesStack.pop();
  if (cycleLockedStack.length > 0) cycleLockedStack.pop();

  if (statesStack.length > 0) {
    states = JSON.parse(JSON.stringify(statesStack[statesStack.length - 1]));
    cycleLocked = cycleLockedStack[cycleLockedStack.length - 1] || false;
  } else {
    states = [];
    cycleLocked = false;
  }

  render();
  saveState();
}

function seedUnknownStates(firstEvent){
  const out = [];
  for(let seq=1; seq<=4; seq++){
    const moves = sequences[seq];
    for(let pos=1; pos<=13; pos++){
      if(moves[pos-1] !== firstEvent) continue;
      for(let doneMask=0; doneMask<=ALL_MASK; doneMask++){
        if(doneMask & bit(seq)) continue;
        out.push({ seq, move: pos, doneMask, modeStart: false });
      }
    }
  }
  return out;
}

function advanceStatesWithEvent(curStates, event){
  const next = [];
  for(const s of curStates){
    if(s.seq === null || s.move === 0){
      const doneMaskNorm = (s.doneMask === ALL_MASK) ? 0 : s.doneMask;
      for(let seq=1; seq<=4; seq++){
        if(doneMaskNorm & bit(seq)) continue;
        if(sequences[seq][0] !== event) continue;
        next.push({ seq, move: 2, doneMask: doneMaskNorm, modeStart: true });
      }
      continue;
    }

    const expected = sequences[s.seq][s.move - 1];
    if(expected !== event) continue;

    const newMove = s.move + 1;

    if(newMove === 14){
      let newDone = s.doneMask | bit(s.seq);
      next.push({ seq: null, move: 0, doneMask: newDone, modeStart: true });
    } else {
      next.push({ seq: s.seq, move: newMove, doneMask: s.doneMask, modeStart: s.modeStart });
    }
  }
  return next;
}

function dedupeStates(list){
  const seen = new Set();
  const out = [];
  for(const s of list){
    const k = `${s.seq ?? "X"}|${s.move}|${s.doneMask}|${s.modeStart?1:0}`;
    if(seen.has(k)) continue;
    seen.add(k);
    out.push(s);
  }
  return out;
}

/* ------------------ Button gating (#6) ------------------ */
function computeAllowedNextEvents(){
  const allowed = new Set();

  if(states.length === 0){
    // If nothing is tracked yet and no inputs, allow anything.
    if(inputHistory.length === 0){
      document.querySelectorAll("button[data-event]").forEach(btn => btn.disabled = false);
    } else {
      // Invalid path (no matching states): disable event buttons
      document.querySelectorAll("button[data-event]").forEach(btn => btn.disabled = true);
    }
    return null;
  }

  for(const s of states){
    // Between sequences -> allowed start events for any not-yet-done sequence in that hypothesis
    if(s.seq === null || s.move === 0){
      const dmNorm = (s.doneMask === ALL_MASK) ? 0 : s.doneMask;
      for(let seq=1; seq<=4; seq++){
        if(dmNorm & bit(seq)) continue;
        allowed.add(sequences[seq][0]); // move1 event
      }
      continue;
    }

    // In a sequence -> only the expected next event
    const ev = sequences[s.seq][s.move - 1];
    if(ev) allowed.add(ev);
  }

  return allowed;
}

function applyAllowedButtons(allowed){
  const btns = document.querySelectorAll("button[data-event]");
  if(!allowed){
    // Already handled in computeAllowedNextEvents for the states.length===0 case
    return;
  }
  btns.forEach(btn => {
    const ev = btn.getAttribute("data-event");
    btn.disabled = !allowed.has(ev);
  });
}

/* ------------------ Rendering ------------------ */
function badgeList(nums, cls){
  if (!nums.length) return `<span class="badge ${cls}">none</span>`;
  return nums.map(n => `<span class="badge ${cls}">${n}</span>`).join("");
}

function render(){
  const status = document.getElementById("status");
  const cycleStatus = document.getElementById("cycleStatus");
  const alert = document.getElementById("alert");
  const banner = document.getElementById("banner");
  const historyBox = document.getElementById("history");
  const top = document.getElementById("timelineTop");
  const bottom = document.getElementById("timelineBottom");

  alert.textContent = "";
  banner.textContent = "";
  top.innerHTML = "";
  bottom.innerHTML = "";

  historyBox.innerHTML = inputHistory.map((e,i)=>`${i+1}. ${e}`).join("<br>");

  // Apply button gating early (so UI always matches state)
  const allowedEvents = computeAllowedNextEvents();
  applyAllowedButtons(allowedEvents);

  if(states.length === 0){
    status.textContent = inputHistory.length
      ? "No match. Use Reset All or Start New Sequence / Start Event."
      : "Waiting for input…";
    cycleStatus.innerHTML = `Cycle status: <b>${cycleLocked ? "LOCKED" : "UNKNOWN"}</b>`;
    return;
  }

  const inSeqStates = states.filter(s => s.seq !== null && s.move !== 0);
  const betweenStates = states.filter(s => s.seq === null || s.move === 0);

  const seqSet = new Set(inSeqStates.map(s => s.seq));
  if (seqSet.size === 0 && betweenStates.length > 0) {
    const possibleNext = new Set();
    for (const st of betweenStates) {
      const dmNorm = (st.doneMask === ALL_MASK) ? 0 : st.doneMask;
      for (let seq=1; seq<=4; seq++) {
        if (dmNorm & bit(seq)) continue;
        possibleNext.add(seq);
      }
    }
    possibleNext.forEach(x => seqSet.add(x));
  }

  const moveSet = new Set(inSeqStates.map(s => s.move));
  const doneMasks = new Set(states.map(s => s.doneMask));
  const locked = (seqSet.size === 1 && moveSet.size === 1 && betweenStates.length === 0);

  let completedNums = [];
  let remainingNums = [];
  let cycleKnown = (doneMasks.size === 1);

  if (cycleKnown) {
    const dm = [...doneMasks][0];
    const dmNorm = (dm === ALL_MASK) ? 0 : dm;
    completedNums = [1,2,3,4].filter(x => dmNorm & bit(x));
    remainingNums = [1,2,3,4].filter(x => !(dmNorm & bit(x)));
  }

  cycleStatus.innerHTML =
    `Cycle status: <b>${cycleLocked ? "LOCKED" : "UNKNOWN"}</b><br>` +
    (cycleKnown
      ? `<div class="badgeRow">Sequences Completed this cycle: ${badgeList(completedNums, "done")}</div>` +
        `<div class="badgeRow">Remaining: ${badgeList(remainingNums, "rem")}</div>`
      : `<div class="badgeRow"><span class="badge unk">Sequences Completed/Remaining: unknown</span></div>`
    );

  let remainingHint = "";
  if(cycleKnown){
    remainingHint =
      `Cycle done: ${completedNums.length ? completedNums.join(", ") : "(none)"}\n` +
      `Remaining this cycle: ${remainingNums.join(", ")}`;
  } else {
    remainingHint = "Cycle done/remaining: unknown (tracking multiple possibilities)";
  }

  // Banner after T,T when Crossroads eliminated; special text when remaining {2,4}
  const last2 = inputHistory.slice(-2);
  if (
    last2.length === 2 &&
    last2[0] === "Tiny Adventures" &&
    last2[1] === "Tiny Adventures"
  ) {
    const candidates = inSeqStates.filter(s =>
      sequences[s.seq][0] === "Tiny Adventures" &&
      sequences[s.seq][1] === "Tiny Adventures" &&
      s.move === 3
    );
    if (candidates.length) {
      const possibleThirdMoves = new Set(candidates.map(s => sequences[s.seq][2]));
      const hasCrossroads = possibleThirdMoves.has("Crossroads of Fate");
      const hasCube = possibleThirdMoves.has("Cube Battle");
      const hasTreasure = possibleThirdMoves.has("Treasure Hunt");

      const onlyTwoOrFourRemain =
        cycleKnown &&
        completedNums.includes(1) && completedNums.includes(3) &&
        remainingNums.length === 2 &&
        remainingNums.includes(2) && remainingNums.includes(4);

      if (!hasCrossroads && (hasCube || hasTreasure)) {
        if (onlyTwoOrFourRemain) {
          banner.textContent =
            "Start-of-sequence 2 or 4: next is either Cube Battle (use 50×) or Treasure Hunt (50× if you need gold).";
        } else {
          banner.textContent =
            "Start-of-sequence: next is either Cube Battle (use 50×) or Treasure Hunt (50× if you need gold).";
        }
      }
    }
  }

  if(!locked){
    status.textContent =
      `Moves logged: ${inputHistory.length}\n` +
      `Possible states: ${states.length}\n` +
      `Possible sequences: ${[...seqSet].sort((a,b)=>a-b).join(", ") || "(between sequences)"}\n` +
      `Possible moves: ${[...moveSet].sort((a,b)=>a-b).join(", ") || "(between sequences)"}\n\n` +
      remainingHint;
    return;
  }

  const s = inSeqStates[0];
  const seq = s.seq;
  const nextExpected = s.move;
  const currentMove = s.move - 1;
  const moves = sequences[seq];

  const upcoming = moves.slice(Math.max(0, nextExpected - 1));
  let nextSpecialIndex = -1;
  for(let i=0;i<upcoming.length;i++){
    if(upcoming[i] === "Cube Battle" || upcoming[i] === "Treasure Hunt"){
      nextSpecialIndex = i;
      break;
    }
  }

  status.textContent =
    `Sequence ${seq}\n` +
    `Move ${currentMove} / 13\n\n` +
    remainingHint;

  const nextEvent = moves[nextExpected - 1];
  alert.classList.remove("pulse50");

  if (nextEvent === "Cube Battle") {
    alert.textContent = "🚨 ENABLE 50× NOW (Cube Battle is next)";
    alert.classList.add("pulse50");
  } else if (nextEvent === "Treasure Hunt") {
    alert.textContent = "💰 Treasure Hunt is next — invest 50× if you need gold";
    alert.classList.add("pulse50");
  }

  for(let i=1;i<=13;i++){
    const ev = moves[i-1];
    const cell = document.createElement("div");
    cell.className = "cell";

    if(ev === "Cube Battle") cell.classList.add("cubeCell");
    if(ev === "Treasure Hunt") cell.classList.add("treasureCell");

    if(i < currentMove) cell.classList.add("done");
    if(i === currentMove) cell.classList.add("current");

    if (nextSpecialIndex >= 0 && i === (nextExpected + nextSpecialIndex)) {
      cell.classList.add("nextSpecial");
    }

    const l = abbrev[ev];
    cell.innerHTML =
      `<div class="step">${i}</div>` +
      `<div class="letter">${(l === "A" || l === "C") ? `<b>${l}</b>` : l}</div>`;

    (i <= 6 ? top : bottom).appendChild(cell);
  }
}

if(!loadState()){
  states = [];
  inputHistory = [];
}
render();
document.getElementById("verNum").textContent = VERSION;
</script>

</body>
</html>
